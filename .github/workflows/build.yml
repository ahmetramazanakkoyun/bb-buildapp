name: Build Klon Motor
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dagilmis dosyalari yerine tasi
        run: |
          mkdir -p app/src/main/java/com/klon/motor
          mv -f ./*.java app/src/main/java/com/klon/motor/ || true
          if [ -f AndroidManifest.xml ]; then mv -f AndroidManifest.xml app/src/main/AndroidManifest.xml; fi
          find app -type f | sort
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: SDK paketleri
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -n 1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0"
      - run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: KlonMotor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
